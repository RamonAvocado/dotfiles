# WARN: FOR THE KEYBINDS USER PREFIX + ?
set-option -sa terminal-overrides ",xterm-256color:RGB" # Overriding terminal colors

# first window is 1
set -g base-index 1

# NOTE: Let you handle text manipulation with VI Motions, and mouse mode 
setw -g mode-keys vi 
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
set -g mouse on

# Movement between windows, is equal to "ALT + h/l"
bind -n M-h previous-window 
bind -n M-l next-window

bind -n M-k send-keys Up
bind -n M-j send-keys Down
bind -n M-v copy-mode

# Dont ask for confirmation when killing a pane
unbind x
bind x kill-pane

# Same path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g @plugin "tmux-plugins/tpm"
# TODO: SEE WHAT THIS DOES BUT IT FIXED SOME QUIRKS WITH BASE TMUX CONFIG
set -g @plugin "tmux-plugins/tmux-sensible" 

# set -g @plugin "tmux-plugins/tmux-resurrect" 	# PERSISTANCE
set -g @plugin "tmux-plugins/tmux-continuum" 	# NO NEED TO SAVE, DOES IT AUTOMATIC

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin "tmux-plugins/tmux-yank" 	# COPY STUFF TO SYSTEM CLIPBOARD

set -g @plugin "christoomey/vim-tmux-navigator" #THIS IS FOR THE MOVEMENT BETWEEN NEOVIM AND TMUX
set -g @plugin "tmux-plugins/tmux-prefix-highlight" #SHOW WHEN THE PREFIX IS CLICKED

set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "arl/gitmux"

# COLORSCHEME
set -g @plugin "catppuccin/tmux#v2.1.3"

##### Statusline #####
set -g status-position top

set -g status-left "#{E:@catppuccin_status_session}"
set -agF status-left "#{E:@catppuccin_status_application}"

set -g status-right "#{?gitmux_present, #{E:@catppuccin_status_gitmux},}"
set -agF status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{?battery_present,#{E:@catppuccin_status_battery},}"

run "~/.tmux/plugins/tpm/tpm"
